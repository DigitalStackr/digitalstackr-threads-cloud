name: Threads Scheduler

on:
  schedule:
    # Every 5 minutes. GitHub may delay by up to ~15 min during peak load.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # allows manual test runs from the Actions tab

permissions:
  contents: write           # needed so the job can commit updated queue.json

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          MAIN_TOKEN: ${{ secrets.THREADS_MAIN_TOKEN }}
          TDS_TOKEN:  ${{ secrets.THREADS_TDS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:    ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          # Lets the run save a rotated TikTok refresh token back into secrets.
          # Without it, a rotation locks TikTok out until re-authorized by hand.
          GH_SECRETS_PAT:       ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scheduler.py

      - name: Answer Telegram DMs (FAQ bot)
        # Polls getUpdates in the same tick. Never fails the run: the scheduler's
        # job is publishing, and a Telegram hiccup must not block that or trigger
        # a failure email.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER:     ${{ secrets.TELEGRAM_OWNER }}
        run: python telegram_faq.py

      - name: Commit queue changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only queue.json is committed. The scheduler now logs to stdout (captured
          # in this run's log), so there is no log.txt to diverge and produce the
          # deterministic end-of-file rebase conflict that used to fail this step.
          # telegram_offset.json must be committed too, otherwise a re-run replays
          # old DMs and double-answers people.
          git add queue.json telegram_offset.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          git commit -m "scheduler: update queue [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "pushed on attempt $i"; exit 0
              fi
            else
              # queue.json cannot be text-merged by git: two overlapping scheduler
              # runs (github cron + cron-job.org fire seconds apart) each rewrite the
              # same JSON. Retrying the rebase reproduces the identical conflict, so
              # we resolve it semantically instead — 'posted' always wins, which can
              # never lose a publish record and never double-posts.
              echo "rebase conflict on attempt $i - resolving semantically"
              cp queue.json /tmp/ours.json 2>/dev/null || true
              cp telegram_offset.json /tmp/ours_offset.json 2>/dev/null || true
              git rebase --abort || true
              git show origin/main:queue.json > /tmp/theirs.json
              if python merge_queue.py /tmp/ours.json /tmp/theirs.json /tmp/merged.json; then
                git reset --hard origin/main
                cp /tmp/merged.json queue.json
                # The Telegram offset is monotonic, so the higher value always wins.
                # Resolving it this way keeps a second committed file from ever
                # reintroducing the deterministic-conflict failure we already fixed once.
                python - <<'PYEOF' || true
import json, os
def load(p):
    try:
        with open(p, encoding="utf-8") as f: return int(json.load(f).get("offset", 0))
    except Exception: return 0
best = max(load("/tmp/ours_offset.json"), load("telegram_offset.json"))
if best:
    with open("telegram_offset.json", "w", encoding="utf-8") as f:
        json.dump({"offset": best}, f, indent=2); f.write("\n")
    print("merged telegram offset ->", best)
PYEOF
                git add queue.json telegram_offset.json
                if git diff --staged --quiet; then
                  echo "merge produced no change vs origin - nothing to push"; exit 0
                fi
                git commit -m "scheduler: update queue (merged concurrent run) [skip ci]"
                if git push origin HEAD:main; then
                  echo "pushed merged queue on attempt $i"; exit 0
                fi
              else
                echo "semantic merge failed on attempt $i"
              fi
            fi
            sleep $((RANDOM % 4 + 3))
          done
          echo "ERROR: could not push after 5 attempts"; exit 1
