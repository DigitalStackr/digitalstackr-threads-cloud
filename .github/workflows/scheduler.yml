name: Threads Scheduler

on:
  schedule:
    # Every 5 minutes. GitHub may delay by up to ~15 min during peak load.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # allows manual test runs from the Actions tab

permissions:
  contents: write           # needed so the job can commit updated queue.json

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          MAIN_TOKEN: ${{ secrets.THREADS_MAIN_TOKEN }}
          TDS_TOKEN:  ${{ secrets.THREADS_TDS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:    ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_PAT:       ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          X_URL_POLICY:     ${{ secrets.X_URL_POLICY }}
        run: python scheduler.py

      - name: Answer Telegram DMs (FAQ bot)
        # Polls getUpdates in the same tick. Never fails the run: publishing is the
        # job here, and a Telegram hiccup must not block it or send a failure email.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER:     ${{ secrets.TELEGRAM_OWNER }}
        run: python telegram_faq.py

      - name: Content runway + silence check
        # A green pipeline with an empty queue looks identical to a healthy one.
        # This is what tells them apart. Never fails the run.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER:     ${{ secrets.TELEGRAM_OWNER }}
        run: python runway_check.py

      - name: Commit queue changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only queue.json + telegram_offset.json are committed. The scheduler logs
          # to stdout (captured in this run's log), so there is no log.txt to diverge
          # and produce the deterministic end-of-file rebase conflict we hit before.
          git add queue.json telegram_offset.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "scheduler: update queue [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "pushed on attempt $i"; exit 0
              fi
            else
              # These files cannot be text-merged by git: two overlapping scheduler
              # runs (github cron + cron-job.org fire seconds apart) each rewrite the
              # same JSON. Retrying the rebase reproduces the identical conflict, so
              # we resolve semantically instead - 'posted' always wins for the queue,
              # and the higher offset always wins for Telegram.
              echo "rebase conflict on attempt $i - resolving semantically"
              # Abort FIRST, then read our side from the commit. Copying the
              # working-tree file here instead would capture git's conflict
              # markers (<<<<<<< / ======= ), and merge_queue.py would die on
              # invalid JSON - which is exactly what every failure email was.
              git rebase --abort || true
              git show HEAD:queue.json > /tmp/ours.json
              git show HEAD:telegram_offset.json > /tmp/ours_offset.json 2>/dev/null || true
              git show origin/main:queue.json > /tmp/theirs.json
              if python merge_queue.py /tmp/ours.json /tmp/theirs.json /tmp/merged.json; then
                git reset --hard origin/main
                cp /tmp/merged.json queue.json
                python merge_offset.py /tmp/ours_offset.json telegram_offset.json || true
                git add queue.json telegram_offset.json
                if git diff --staged --quiet; then
                  echo "merge produced no change vs origin - nothing to push"; exit 0
                fi
                git commit -m "scheduler: update queue (merged concurrent run) [skip ci]"
                if git push origin HEAD:main; then
                  echo "pushed merged queue on attempt $i"; exit 0
                fi
              else
                echo "semantic merge failed on attempt $i"
              fi
            fi
            sleep $((RANDOM % 4 + 3))
          done
          echo "ERROR: could not push after 5 attempts"; exit 1
